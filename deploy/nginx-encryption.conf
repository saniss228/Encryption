# ============================================================================
#  Nginx для мессенджера Encryption (сервер 45.90.45.92)
#  Сайт отдаём на 80/443, а сам FastAPI-сервер слушает порт 3000.
#  Порт 3000 браузеры не блокируют: приложения (ПК и Android) могут
#  подключаться к нему напрямую, минуя nginx. Так же работает и WebSocket.
#
#  Установка:
#     sudo cp deploy/nginx-encryption.conf /etc/nginx/sites-available/encryption
#     sudo ln -s /etc/nginx/sites-available/encryption /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream encryption_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 45.90.45.92;

    # Ограничения на размер загружаемых чанков (файлы идут по 1 МБ)
    client_max_body_size 16m;

    # Безопасность: заголовки добавляет и сам FastAPI, но дублируем на краю
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # ── Сайт и API ─────────────────────────────────────────────────────────
    location / {
        proxy_pass http://encryption_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;          # важно для скачивания файлов и SSE
    }

    # ── WebSocket (сообщения, статусы, сигнализация звонков) ──────────────
    location /ws {
        proxy_pass http://encryption_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Загрузка/скачивание чанков файлов (без буферизации в память) ──────
    location /api/v1/files/ {
        proxy_pass http://encryption_backend;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 32m;
        proxy_read_timeout 600s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Статика сайта кэшируется браузером
    location ~* ^/(css|js|assets)/ {
        proxy_pass http://encryption_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Иконка для PWA/фавикон
    location = /manifest.webmanifest { proxy_pass http://encryption_backend; }
    location = /sw.js { proxy_pass http://encryption_backend; add_header Cache-Control "no-cache"; }
}

